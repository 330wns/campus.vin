name: Diagnose campus.vin routing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Inspect Pages domain and apex DNS
        shell: bash
        run: |
          set -euo pipefail
          api=https://api.cloudflare.com/client/v4
          pages=$(curl --silent --show-error -H "Authorization: Bearer $CF_TOKEN" "$api/accounts/$CF_ACCOUNT/pages/projects/campus-vin/domains/campus.vin")
          echo 'Pages domain:'
          jq '{success,errors,result:{name:.result.name,status:.result.status,validation_data:.result.validation_data}}' <<< "$pages"
          zones=$(curl --silent --show-error -H "Authorization: Bearer $CF_TOKEN" "$api/zones?name=campus.vin")
          echo 'Zone access:'
          jq '{success,errors,result:[.result[]? | {id,name,status}]}' <<< "$zones"
          zone_id=$(jq -r '.result[0].id // empty' <<< "$zones")
          if [[ -n "$zone_id" ]]; then
            records=$(curl --silent --show-error -H "Authorization: Bearer $CF_TOKEN" "$api/zones/$zone_id/dns_records?name.exact=campus.vin")
            echo 'Apex records:'
            jq '{success,errors,result:[.result[]? | {id,type,name,content,proxied}]}' <<< "$records"
          fi
